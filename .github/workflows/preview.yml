name: Preview

# On demand rather than on every push: a change under packages/ reaches all
# eighteen apps, and building all eighteen on each push to review one chain is
# most of a deploy's cost for none of its value. Comment on a pull request:
#
#   /preview <sha>                  the apps that commit changes
#   /preview solana near <sha>      those apps at that commit
#   /preview all <sha>              all eighteen
#
# The full commit sha is required, and a request without one is answered with the
# command to paste rather than a build. See the authorize job for why.
on:
  issue_comment:
    types: [created]

# Requests queue rather than cancel each other: a second `/preview` is another
# request, not a correction of the first, and two runs editing the same comment
# would race.
concurrency:
  group: preview-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    # A cheap pre-filter only — author_association covers collaborators of any
    # role, including read-only ones, so the job checks the actual permission
    # below before it resolves anything.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/preview') &&
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      targets: ${{ steps.targets.outputs.targets }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Acknowledge the request
        run: |
          gh api --silent -X POST \
            "repos/$GH_REPO/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      - name: Check the commenter can write to this repository
        env:
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          # Fails the job if the lookup fails, so an unanswerable question denies
          # the request rather than waving it through.
          level=$(gh api "repos/$GH_REPO/collaborators/$COMMENTER/permission" --jq .permission)
          case "$level" in
            admin | maintain | write) echo "$COMMENTER has $level access." ;;
            *)
              gh pr comment "$PR_NUMBER" --body \
                "@$COMMENTER — previewing needs write access to this repository."
              exit 1
              ;;
          esac

      - name: Take the commit from the comment
        id: commit
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          # The permission check above is made against the comment, so the code
          # built has to be the code the commenter was looking at when they wrote
          # it. Reading the branch tip here instead would leave a window for a push
          # to land between the two and be built with the deploy credentials — the
          # check and the thing checked would not be the same commit. So the sha
          # below is the one in the comment, verbatim and in full, and nothing that
          # runs after it can move it.
          sha=$(head -n1 <<<"$BODY" | tr -d '\r' | tr '[:upper:]' '[:lower:]' \
            | grep -oE '\b[0-9a-f]{40}\b' | head -n1 || true)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          if [ -z "$sha" ]; then
            echo "No commit named; the suggest job will answer with the command."
            exit 0
          fi

          # It has to be a commit of this pull request, so the argument cannot aim
          # the build at an arbitrary object in the repository. The answer is a
          # yes or a no — the sha itself still comes from the comment.
          if ! gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/commits" --jq '.[].sha' \
            | grep -qx "$sha"; then
            gh pr comment "$PR_NUMBER" --body \
              "\`${sha:0:7}\` is not a commit of this pull request."
            exit 1
          fi

      - name: Select the apps to deploy
        id: targets
        if: steps.commit.outputs.sha != ''
        env:
          BODY: ${{ github.event.comment.body }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          # Read over the API rather than from a checkout: this job authorizes the
          # request and has no business fetching the branch's code to do it.
          available=$(gh api "repos/$GH_REPO/contents/apps?ref=$SHA" \
            --jq '.[] | select(.type == "dir") | .name' | sort)
          requested=$(head -n1 <<<"$BODY" | tr -d '\r' | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#^/preview[[:space:]]*##' | tr ',' ' ' | tr -s '[:space:]' '\n' \
            | grep -v '^$' | grep -vE '^[0-9a-f]{40}$' || true)

          if [ -z "$requested" ]; then
            # Anything shared rebuilds everything: shared and ui are imported by all
            # eighteen apps, and resolving which apps a cosmos-shared change reaches
            # would mean walking the workspace graph here to save a few builds.
            changed=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
            if grep -qE '^(packages/|bun\.lock|package\.json|tsconfig\.json|biome\.json|bunfig\.toml)' <<<"$changed"; then
              selected="$available"
            else
              selected=$(sed -n 's#^apps/\([^/]*\)/.*#\1#p' <<<"$changed" | sort -u)
            fi
            # A deleted app is still a path in the diff.
            selected=$(comm -12 <(echo "$selected") <(echo "$available"))
          elif [ "$requested" = "all" ]; then
            selected="$available"
          else
            selected=$(sort -u <<<"$requested")
            unknown=$(comm -23 <(echo "$selected") <(echo "$available") | paste -sd' ' -)
            if [ -n "$unknown" ]; then
              gh pr comment "$PR_NUMBER" --body \
                "No such app: \`$unknown\`. Available: $(paste -sd' ' - <<<"$available")."
              exit 1
            fi
          fi

          if [ -z "$selected" ]; then
            gh pr comment "$PR_NUMBER" --body \
              "Nothing to preview: that commit changes no app. Name one, or ask for \`all\`."
          fi

          # The Vercel project id lives in a per-app secret, so each target carries
          # the name of the one to read.
          targets=$(jq -Rnc '[inputs | select(length > 0) | {app: ., secret: ("VERCEL_PROJECT_ID_" + ascii_upcase)}]' <<<"$selected")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Previewing: $(jq -r 'if length == 0 then "nothing" else [.[].app] | join(", ") end' <<<"$targets")"

  suggest:
    # Answering a request that named no commit is the one thing here that needs the
    # branch tip, and it goes in a job of its own so that no step which resolves a
    # ref at runtime sits next to the one that checks a commit out.
    needs: authorize
    if: needs.authorize.outputs.sha == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Answer with the command to paste
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha)
          args=$(head -n1 <<<"$BODY" | tr -d '\r' | sed -E 's#^/preview[[:space:]]*##')
          gh pr comment "$PR_NUMBER" --body \
            "Name the commit to build: \`/preview ${args:+$args }$tip\`"

  preview:
    needs: authorize
    # An unanswered request leaves both empty, and an empty targets is not a matrix.
    if: needs.authorize.outputs.sha != '' && needs.authorize.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Hold VERCEL_TOKEN and the project ids as environment secrets, so the only
    # job that runs the branch's code is also the only one that can read them.
    environment: preview
    strategy:
      # Same reason as the production deploy: one app's failure must not cancel the
      # others, or a single broken app reads as "the previews are broken".
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.authorize.outputs.targets) }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.target.secret] }}

    steps:
      - name: Checkout the authorized commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ needs.authorize.outputs.sha }}

      - name: Verify the checkout is the authorized commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.authorize.outputs.sha }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun add --global vercel@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./apps/${{ matrix.target.app }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./apps/${{ matrix.target.app }}
        timeout-minutes: 10

      - name: Deploy Project Artifacts to Vercel
        run: |
          set -euo pipefail
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} \
            --meta githubPrNumber=${{ github.event.issue.number }} \
            --meta githubCommitSha=${{ needs.authorize.outputs.sha }} | tail -n1)
          mkdir -p "$RUNNER_TEMP/urls"
          echo "$DEPLOYMENT_URL" > "$RUNNER_TEMP/urls/${{ matrix.target.app }}"
          echo "🔍 Preview for ${{ matrix.target.app }}: $DEPLOYMENT_URL"
        working-directory: ./apps/${{ matrix.target.app }}

      # One artifact per app rather than a job output: matrix jobs share a single
      # output slot and would overwrite each other down to one URL.
      - name: Publish the URL for the comment job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preview-url-${{ matrix.target.app }}
          path: ${{ runner.temp }}/urls/
          retention-days: 1

  comment:
    needs: [authorize, preview]
    # always(), so a run where some apps failed still reports the ones that shipped.
    if: >-
      always() && needs.authorize.result == 'success' &&
      needs.authorize.outputs.sha != '' && needs.authorize.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Collect the preview URLs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: preview-url-*
          merge-multiple: true
          path: urls

      - name: Post the preview table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          SHA: ${{ needs.authorize.outputs.sha }}
          TARGETS: ${{ needs.authorize.outputs.targets }}
        run: |
          set -euo pipefail
          {
            echo "### Preview deployments"
            echo
            echo "| App | Preview |"
            echo "| --- | --- |"
            for app in $(jq -r '.[].app' <<<"$TARGETS"); do
              if [ -f "urls/$app" ]; then
                echo "| \`$app\` | $(cat "urls/$app") |"
              else
                echo "| \`$app\` | deploy failed — see the run log |"
              fi
            done
            echo
            echo "_Built from \`${SHA:0:7}\`. Signing in with a Kiln Vercel account is required._"
          } > body.md
          # --edit-last keeps one table that tracks the branch rather than a new
          # comment every time someone asks for a preview.
          gh pr comment "$PR_NUMBER" --body-file body.md --edit-last --create-if-none
