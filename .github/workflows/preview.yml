name: Preview

# On demand rather than on every push: a change under packages/ reaches all
# eighteen apps, and building all eighteen on each push to review one chain is
# most of a deploy's cost for none of its value. Comment `/preview` on a pull
# request instead:
#
#   /preview                 the apps this pull request can change
#   /preview solana near     those apps
#   /preview all             all eighteen
#   /preview solana 9cbbcff  that app at a named commit
on:
  issue_comment:
    types: [created]

# Requests queue rather than cancel each other: `/preview near` after
# `/preview solana` is a second request, not a correction of the first, and two
# runs editing the same comment would race.
concurrency:
  group: preview-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    # A comment on an issue is not a pull request, and secrets must not be reachable
    # from a fork's code or from someone without write access to this repository.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/preview') &&
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pinned: ${{ steps.pr.outputs.pinned }}

    steps:
      - name: Acknowledge the request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --silent -X POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      # The write-access check above is made against the comment, but the branch tip
      # is read here, afterwards — a push landing in between would be built with
      # deploy credentials and nobody would have read it. Naming a commit in the
      # comment closes that window, since the commit the approver saw is the commit
      # that gets built; a bare /preview takes the tip and pays for it with the
      # approval gate on the deploy job below.
      - name: Resolve the commit to build
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          pr=$(gh pr view "$PR_NUMBER" --json headRefOid,baseRefOid,isCrossRepository)

          if [ "$(jq -r .isCrossRepository <<<"$pr")" = "true" ]; then
            echo "::error::Refusing to build a fork's code with deploy credentials." >&2
            exit 1
          fi

          requested=$(head -n1 <<<"$BODY" | tr -d '\r' | tr '[:upper:]' '[:lower:]' \
            | grep -oE '\b[0-9a-f]{7,40}\b' | head -n1 || true)

          if [ -n "$requested" ]; then
            # Only a commit of this pull request, so the argument cannot point the
            # build at an arbitrary object in the repository.
            head_sha=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/commits" --jq '.[].sha' \
              | grep -m1 -E "^$requested" || true)
            if [ -z "$head_sha" ]; then
              gh pr comment "$PR_NUMBER" --body \
                "\`$requested\` is not a commit of this pull request."
              exit 1
            fi
            pinned=named
          else
            head_sha=$(jq -r .headRefOid <<<"$pr")
            pinned=tip
          fi

          {
            echo "head_sha=$head_sha"
            echo "base_sha=$(jq -r .baseRefOid <<<"$pr")"
            echo "pinned=$pinned"
          } >> "$GITHUB_OUTPUT"
          echo "Building $head_sha (${pinned})"

      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Select the apps to deploy
        id: targets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.comment.body }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          available=$(for dir in apps/*/; do basename "$dir"; done | sort)
          requested=$(head -n1 <<<"$BODY" | tr -d '\r' | tr '[:upper:]' '[:lower:]' | sed -E 's#^/preview[[:space:]]*##' | tr ',' ' ' | tr -s '[:space:]' '\n' | grep -v '^$' | grep -vE '^[0-9a-f]{7,40}$' || true)

          if [ -z "$requested" ]; then
            # A bare /preview reviews what the branch touched. Anything shared
            # rebuilds everything: shared and ui are imported by all eighteen apps,
            # and resolving which apps a cosmos-shared change reaches would mean
            # walking the workspace graph here to save a few builds.
            # Against the merge base, not the tip of main, or every commit landed
            # on main since the branch started would count as this branch's change.
            changed=$(git diff --name-only "$(git merge-base "$BASE_SHA" HEAD)" HEAD)
            if grep -qE '^(packages/|bun\.lock|package\.json|tsconfig\.json|biome\.json|bunfig\.toml)' <<<"$changed"; then
              selected="$available"
            else
              selected=$(sed -n 's#^apps/\([^/]*\)/.*#\1#p' <<<"$changed" | sort -u)
            fi
            # A deleted app is still a path in the diff.
            selected=$(comm -12 <(echo "$selected") <(echo "$available"))
          elif [ "$requested" = "all" ]; then
            selected="$available"
          else
            selected=$(sort -u <<<"$requested")
            unknown=$(comm -23 <(echo "$selected") <(echo "$available") | paste -sd' ' -)
            if [ -n "$unknown" ]; then
              gh pr comment "${{ github.event.issue.number }}" --body \
                "No such app: \`$unknown\`. Available: $(paste -sd' ' - <<<"$available")."
              exit 1
            fi
          fi

          if [ -z "$selected" ]; then
            gh pr comment "${{ github.event.issue.number }}" --body \
              "Nothing to preview: this branch changes no app. Name one, or \`/preview all\`."
          fi

          # The Vercel project id lives in a per-app secret, so each target carries
          # the name of the one to read.
          targets=$(jq -Rnc '[inputs | select(length > 0) | {app: ., secret: ("VERCEL_PROJECT_ID_" + ascii_upcase)}]' <<<"$selected")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Previewing: $(jq -r 'if length == 0 then "nothing" else [.[].app] | join(", ") end' <<<"$targets")"

  preview:
    needs: resolve
    if: needs.resolve.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The gate that makes a bare /preview safe: with required reviewers on this
    # environment the deploy waits for a human, and the run it waits on already has
    # its commit frozen and on screen. Hold VERCEL_TOKEN and the project ids as
    # environment secrets so the branch's code cannot be built without passing it.
    environment: preview
    strategy:
      # Same reason as the production deploy: one app's failure must not cancel the
      # others, or a single broken app reads as "the previews are broken".
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets) }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.target.secret] }}

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}

      - name: Verify the checkout is the commit that was approved
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.resolve.outputs.head_sha }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun add --global vercel@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./apps/${{ matrix.target.app }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./apps/${{ matrix.target.app }}
        timeout-minutes: 10

      - name: Deploy Project Artifacts to Vercel
        run: |
          set -euo pipefail
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} \
            --meta githubPrNumber=${{ github.event.issue.number }} \
            --meta githubCommitSha=${{ needs.resolve.outputs.head_sha }} | tail -n1)
          mkdir -p "$RUNNER_TEMP/urls"
          echo "$DEPLOYMENT_URL" > "$RUNNER_TEMP/urls/${{ matrix.target.app }}"
          echo "🔍 Preview for ${{ matrix.target.app }}: $DEPLOYMENT_URL"
        working-directory: ./apps/${{ matrix.target.app }}

      # One artifact per app rather than a job output: matrix jobs share a single
      # output slot and would overwrite each other down to one URL.
      - name: Publish the URL for the comment job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preview-url-${{ matrix.target.app }}
          path: ${{ runner.temp }}/urls/
          retention-days: 1

  comment:
    needs: [resolve, preview]
    # always(), so a run where some apps failed still reports the ones that shipped.
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Collect the preview URLs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: preview-url-*
          merge-multiple: true
          path: urls

      - name: Post the preview table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          PINNED: ${{ needs.resolve.outputs.pinned }}
          TARGETS: ${{ needs.resolve.outputs.targets }}
        run: |
          set -euo pipefail
          {
            echo "### Preview deployments"
            echo
            echo "| App | Preview |"
            echo "| --- | --- |"
            for app in $(jq -r '.[].app' <<<"$TARGETS"); do
              if [ -f "urls/$app" ]; then
                echo "| \`$app\` | $(cat "urls/$app") |"
              else
                echo "| \`$app\` | deploy failed — see the run log |"
              fi
            done
            echo
            if [ "$PINNED" = "named" ]; then origin="the commit the request named"; else origin="the branch tip when the request was read"; fi
            echo "_Built from \`${HEAD_SHA:0:7}\`, $origin. Signing in with a Kiln Vercel account is required._"
          } > body.md
          # --edit-last keeps one table that tracks the branch rather than a new
          # comment every time someone asks for a preview.
          gh pr comment "$PR_NUMBER" --body-file body.md --edit-last --create-if-none
